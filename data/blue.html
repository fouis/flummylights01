<form action="/"  method="post">
    <div class="row g-2">
        <div class="col-lg-4 col-md-6 col-12">
            <div class="border border-2 rounded p-1 h-100">
                <div class="row">
                    <div class="col">
                        <span id="blinkTimeInput">%BLINKTIME%</span>
                    </div>
                </div>
                <div class="row">
                    <div class="col-3">
                        <label for="blinkTime" class="form-label">Blink time</label>
                    </div>
                    <div class="col-7">
                        <input type="range" class="form-range" name="BLINKTIME" id="blinkTime" min="200" max="1000" value="%BLINKTIME%" step="10" onchange="document.getElementById('blinkTimeInput').innerHTML=this.value;">
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-3 col-md-4 col-6 d-flex justify-content-center mx-auto">
        <input type="submit" class="btn btn-success btn-lg" name="blue" value="Submit">
        </div>
    </div>
</form>
