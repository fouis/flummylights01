<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <link rel="stylesheet" type="text/css" href="style.css">
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="script.js"></script>
    <script>
        $(document).ready(function(){
	        includeHTML("%STATIC%");
        });

    </script>
    

    <title>Flummy Lights</title>
  </head>
  <body style="background: %PAGECOLOR%;">

    <div class="container-fluid g-1">
        <div class="row bg-light justify-content-between">
            <div class="col-6 bg-primary">
                <h1>Flummy Lights</h1>
            </div>
        </div>
    </div>
    <nav>
        <div class="nav nav-tabs" id="nav-tab" role="tablist">
          <button class="nav-link %SELECT_ACTIVE%" id="nav-flummy-tab" data-bs-toggle="tab" data-bs-target="#nav-select" type="button" role="tab" >Select</button>
          <button class="nav-link %PARAMETER_ACTIVE%" id="nav-parameter-tab" data-bs-toggle="tab" data-bs-target="#nav-parameter" type="button" role="tab" >Parameter</button>
          <button class="nav-link %INFO_ACTIVE%" id="nav-info-tab" data-bs-toggle="tab" data-bs-target="#nav-info" type="button" role="tab" >Info</button>
        </div>
    </nav>
    <div class="tab-content" id="nav-tabContent">
        <div class="tab-pane fade show %SELECT_ACTIVE%" id="nav-select" role="tabpanel">
            <div class="container-fluid g-1 my-1">
                <div class="row g-5 px-2">
                    <div class="col">
                        <h3>Sequences</h3>
                        <select class="form-select form-select-lg bg-info" id="showsel"  onchange="newShow(this.value);">
                         %SHOWOPTIONS%
                        </select>    
                    </div>
                </div>
                <div class="row g-5 px-2">
                    <div class="col">
                        <!-- spacer row -->
                        &nbsp;
                    </div>
                </div>
                <div class="row g-5 px-2">
                    <div class="col">
                        <h3>Presets</h3>
                        <form name="BrowserSurvey" action="#">
                            <select id="presetselect" class="form-select" name="browser" onchange="presetChanged();">
                                <option></option>
                                <option value="customOption">[enter new preset]</option>
                                %PRESETOPTIONS%
                            </select>
                            <input id="presetinput" name="browser" style="display:none;" disabled="disabled" onblur="presetBlur();">
                            <input id="presetsave" type="submit" style="display:none;" disabled="disabled" value="Save">
                        </form>

                    </div>
                </div>

            </div>
        </div>
        <div class="tab-pane fade %PARAMETER_ACTIVE%" id="nav-parameter" role="tabpanel">
            <div class="container-fluid g-1 my-1">
                %SHOWBOX%
                <div class="%HIDDEN%" w3-include-html="red.html"></div>
            </div>
        </div>
        <div class="tab-pane fade %INFO_ACTIVE%" id="nav-info" role="tabpanel">
            <div class="container-fluid g-1 my-1">
                %INFOBOX%
            </div>
        </div>
    </div>
      


    <!--  Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>


	
	
  </body>
</html>
